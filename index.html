<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Find and watch your personalized Anteros experience."
    />
    <title>Anteros — Your Experience</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="kiosk">
      <section class="lookup" aria-labelledby="lookup-title">
        <div class="brand" aria-label="Anteros">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span>ANTEROS</span>
        </div>

        <div class="lookup-content">
          <p class="eyebrow">Tonight, you’re the main character</p>
          <h1 id="lookup-title">Your story is ready.</h1>
          <p class="intro">
            Enter the email you registered with to watch your film.
          </p>

          <form id="lookup-form" novalidate>
            <label for="email">Email address</label>
            <div class="field-row">
              <input
                id="email"
                name="email"
                type="email"
                inputmode="email"
                autocomplete="email"
                autocapitalize="none"
                spellcheck="false"
                placeholder="you@example.com"
                required
              />
              <button type="submit">Play my film</button>
            </div>
          </form>

          <p id="message" class="message" role="status" aria-live="polite"></p>
        </div>

        <p class="privacy">Your email stays on this device.</p>
      </section>

      <section class="screen" aria-label="Experience player">
        <video
          id="player"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
        ></video>
        <div class="screen-shade" aria-hidden="true"></div>
        <div id="idle-label" class="idle-label">
          <span class="live-dot" aria-hidden="true"></span>
          Anteros stories
        </div>
        <div id="experience-label" class="experience-label" hidden></div>
        <button id="reset" class="reset" type="button" hidden>
          Back to all stories
        </button>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
